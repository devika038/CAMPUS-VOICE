server:
  port: ${PORT:8080}

spring:
  application:
    name: campusvoice-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/campus_voice?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  web:
    resources:
      static-locations: classpath:/static/,file:./

app:
  jwt:
    secret: ${JWT_SECRET:4c616d707573566f6963655365637572654a77745365637265744b657932303236466f7243616d707573566f696365417070}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080}
